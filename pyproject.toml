[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octoflow"
version = "0.2.0"
description = "Biologically-inspired cephalopod multi-agent coding swarm orchestrator with 3D connectome visualizer, surprise gating, and Omni-IDE auto-onboarding"
readme = "README.md"
authors = [{ name = "OctoFlow Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["multi-agent", "swarm", "autonomous-agents", "cephalopod", "neural-network", "developer-tools", "claude", "cursor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "requests>=2.28.0",
    "typer>=0.9.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "scipy>=1.8.0",
]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
octoflow = "octoflow.cli:app"
octo = "octoflow.cli:app"
octos = "octoflow.cli:octos_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["octopus_brain*", "envs*", "octoflow*"]
exclude = ["tests*", "experiments*", "visualizer*", "checkpoints*"]

[tool.setuptools.package-data]
octoflow = ["dist/**", "dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
