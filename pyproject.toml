[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octoflow"
version = "0.2.0"
description = "Biologically-inspired cephalopod multi-agent coding swarm orchestrator with 3D connectome visualizer, surprise gating, and Omni-IDE auto-onboarding"
readme = "README.md"
authors = [{ name = "OctoFlow Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["multi-agent", "swarm", "autonomous-agents", "cephalopod", "neural-network", "developer-tools", "claude", "cursor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "typer>=0.9.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "scipy>=1.8.0",
]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
octoflow = "octoflow.cli:app"
octo = "octoflow.cli:app"
octos = "octoflow.cli:octos_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["octopus_brain*", "envs*", "octoflow*"]
exclude = ["tests*", "experiments*", "visualizer*", "checkpoints*"]

[tool.setuptools.package-data]
octoflow = ["dist/**", "dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m \"not live\""
markers = [
    "unit: Fast, isolated unit tests with no external dependencies or child processes",
    "integration: Multi-component integration tests across conductor, sandbox, and bus",
    "pty: Pseudo-terminal interactive UI and terminal rendering tests",
    "live: Live tests requiring real external network or live LLM provider connections",
    "slow: Tests with execution time exceeding 2 seconds",
    "characterization: Baseline regression tests preserving established swarm behaviors",
    "security: Path traversal, command injection, secret redaction, and sandbox security tests",
    "integration_local: Local integration tests allowed to use localhost loopback sockets",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["octoflow", "tests"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "notebooks",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (target Python 3.10)
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line length handled by ruff format
    "B008",  # do not perform function calls in argument defaults (standard in Typer/Click/FastAPI CLI)
]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts, mock fixtures, hardcoded tokens, loopback sockets, and shell commands
"tests/**" = [
    "S101",  # use of assert
    "S105",  # possible hardcoded password / token in fixtures
    "S106",  # possible hardcoded password in arg
    "S108",  # insecure temp file usage (standard pytest tmp_path)
    "S311",  # pseudo-random generators in tests
    "S603",  # subprocess call without shell=True
    "S607",  # start process with partial path
    "B018",  # useless expression in tests
    "E402",  # module level import not at top of file (pytestmark at top)
]
# Scripts for coverage/benchmarks
"scripts/**" = [
    "S603",
    "S607",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
