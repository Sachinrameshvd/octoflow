name: First Interaction Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome First-Time Contributors
        uses: actions/first-interaction@v1.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Welcome to the OctoFlow community! Thank you for opening your first issue.
            If this is a bug report, please make sure you have attached the output of `octoflow bugreport`.
            A maintainer will review your issue during our scheduled weekly triage block.
          pr-message: >
            Welcome and thank you for opening your first pull request in OctoFlow!
            Our automated CI suite (linting, typechecks, unit tests, and documentation link verification)
            will run shortly. Please make sure your branch adheres to the `octos/<feature>` convention
            and the zero-emoji presentation policy. We look forward to reviewing your changes!
