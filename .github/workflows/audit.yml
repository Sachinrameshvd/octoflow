name: Security Audit

on:
  schedule:
    # Run weekly every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: PyPI Dependency Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Package & Audit Tooling
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install pip-audit

    - name: Run pip-audit (Fail on High/Critical)
      run: |
        pip-audit --desc --fail-on high

  npm-audit:
    name: Frontend NPM Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'visualizer/package-lock.json'

    - name: Install Visualizer Dependencies
      run: |
        cd visualizer
        npm ci

    - name: Run npm audit (Fail on High/Critical)
      run: |
        cd visualizer
        npm audit --audit-level=high
