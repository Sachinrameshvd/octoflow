name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-base:
    name: Base Package Unit Tests (No Torch/ML)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Base Package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify Lazy Imports (No Torch in sys.modules)
      run: |
        python -X importtime -c "import sys, octoflow; assert 'torch' not in sys.modules; assert 'onnxruntime' not in sys.modules"

    - name: Run Pytest Base Suite (Skipping Optional ML)
      run: |
        pytest tests/ -v --durations=10

  test-ml:
    name: ML Optional Extra & Parity Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Package with [ml] Extra
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ml]"

    - name: Run Full Test Suite with ML & Gate Parity
      run: |
        pytest tests/ -v --durations=10

    - name: Run Smoke Training (10 Episodes)
      run: |
        python experiments/train.py --episodes 10 --eval-every 5 --checkpoint checkpoints/ci_model.pt

    - name: Run Smoke Inference
      run: |
        python experiments/infer.py --checkpoint checkpoints/ci_model.pt --episodes 2 --render terminal

  visualizer:
    name: WebGL Visualizer TypeScript Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Three.js Visualizer
      run: |
        cd visualizer
        npm ci || npm install
        npm run build
