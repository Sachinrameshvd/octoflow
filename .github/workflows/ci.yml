name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: PyTorch Unit Tests & Smoke Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Pytest Test Suite
      run: |
        pytest tests/ -v --durations=10

    - name: Run Smoke Training (10 Episodes)
      run: |
        python experiments/train.py --episodes 10 --eval-every 5 --checkpoint checkpoints/ci_model.pt

    - name: Run Smoke Inference
      run: |
        python experiments/infer.py --checkpoint checkpoints/ci_model.pt --episodes 2 --render terminal

  visualizer:
    name: WebGL Visualizer TypeScript Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Three.js Visualizer
      run: |
        cd visualizer
        npm ci || npm install
        npm run build
