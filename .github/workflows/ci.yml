name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint & Style (Ruff)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Lint Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Ruff Check
      run: |
        ruff check .

    - name: Ruff Format Check
      run: |
        ruff format --check .

  typecheck:
    name: Gradual Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Package & Type Stubs
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install mypy types-requests

    - name: Run mypy
      run: |
        mypy

  perf:
    name: Performance Baseline (Informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Performance Baseline (--quick)
      run: |
        python scripts/perf_baseline.py --quick --output benchmarks/perf/ci_baseline.json --check-thresholds benchmarks/perf/thresholds.json

  test-base:
    name: Base Package Unit Tests (No Torch/ML)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            experimental: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Base Package from Lockfile
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install --no-deps -e .

    - name: Verify Lazy Imports (No Torch in sys.modules)
      run: |
        python -X importtime -c "import sys, octoflow; assert 'torch' not in sys.modules; assert 'onnxruntime' not in sys.modules"

    - name: Run Pytest Base Suite (Skipping Optional ML)
      run: |
        pytest tests/ -v --durations=10

  test-ml:
    name: ML Optional Extra & Parity Verification
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            experimental: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Package with [ml] Extra
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ml]"

    - name: Run Full Test Suite with ML & Gate Parity
      run: |
        pytest tests/ -v --durations=10

    - name: Run Smoke Training (10 Episodes)
      run: |
        python experiments/train.py --episodes 10 --eval-every 5 --checkpoint checkpoints/ci_model.pt

    - name: Run Smoke Inference
      run: |
        python experiments/infer.py --checkpoint checkpoints/ci_model.pt --episodes 2 --render terminal

  visualizer:
    name: WebGL Visualizer Quality Gates & Dist Sync
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'visualizer/package-lock.json'

    - name: Install Frontend Dependencies
      run: |
        cd visualizer
        npm ci

    - name: TypeScript Strict Check
      run: |
        cd visualizer
        npx tsc --noEmit

    - name: ESLint Static Analysis
      run: |
        cd visualizer
        npm run lint

    - name: Vitest Unit & Reconnect Suite
      run: |
        cd visualizer
        npm run test

    - name: NPM Security Audit (Report-Only)
      run: |
        cd visualizer
        npm audit --audit-level=high || true

    - name: Build and Sync Distribution Artifacts
      run: |
        bash scripts/sync_visualizer.sh

    - name: Distribution Staleness Check
      run: |
        git diff --exit-code octoflow/dist
